kind = "mobile"
previewPath = "/railguard/"
title = "RailGuard"
description = "A premium mobile railway safety platform for AI-powered crack detection, inspection operations, defect intelligence, maintenance coordination, and engineering analytics."
version = "1.0.0"
id = "artifacts/railguard"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/railguard/" ]
localPort = 22460

[services.development]
run = "pnpm --filter @workspace/railguard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/railguard", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/railguard", "run", "serve" ]

[services.env]
PORT = "22460"
BASE_PATH = "/railguard/"
