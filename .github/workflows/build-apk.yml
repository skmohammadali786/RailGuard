name: Build RailGuard APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Verify retained signing key exists
        run: |
          test -f debug.keystore
          keytool -list -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA256:'

      - name: Build signed release APK
        run: ./gradlew --no-daemon --stacktrace clean assembleRelease

      - name: Verify APK signature and package
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RailGuard-Installable-APK-v1.0.1
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-build-${{ github.run_number }}
          name: RailGuard v1.0.1 Build ${{ github.run_number }}
          body: |
            RailGuard Android release build 1.0.1.

            The APK is built from the main branch and its Android signing
            certificate is verified during CI.
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
